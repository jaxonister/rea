
name: Sync upstream

on:
  schedule:
    - cron: "0 * * * *" # 每小时执行一次（UTC）
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/morluto/rea.git
          git fetch upstream
          git checkout main
          git merge upstream/main
          git push origin main
